name: CD - Control Financiero (Firebase + IIS)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: self-hosted 

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar Dependencias
      run: npm install

    - name: Compilar SPA (Vite / React)
      run: npm run build
      env:
        VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }} 
        VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    - name: Desplegar en IIS Local (Windows)
      run: |
        # Forzar la creación de la carpeta si no existe
        New-Item -ItemType Directory -Force -Path C:\Users\rojas\OneDrive\Desktop\finanzas-pro\dist
        
        # Limpiar los archivos viejos
        Remove-Item -Path "C:\Users\rojas\OneDrive\Desktop\finanzas-pro\dist\*" -Recurse -Force -ErrorAction SilentlyContinue
        
        # Copiar la nueva compilación del SPA
        Copy-Item -Path "dist\*" -Destination C:\Users\rojas\OneDrive\Desktop\finanzas-pro\dist -Recurse -Force


    - name: Desplegar en Firebase Hosting
      run: |
        # Usamos las herramientas de Firebase CLI previamente instaladas de forma global
        firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
